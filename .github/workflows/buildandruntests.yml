name: Build & Run all tests (release)

on:
    push:
    pull_request:
    workflow_dispatch:
    
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: cmd

jobs:
    
    build-latest:
        name: Prepare and build on Latest Windows Server VM
        runs-on: windows-latest
        steps:
          - uses: actions/checkout@v2
          
          - name: Install dependencies into Virtual Environment...
            run: _RegisterHelixNUnit.bat
          
          - name: Build project in Release-mode, compile Pas-units, run tests
            run: _RebuildReleaseAndRunTestsForGitHubActions.bat
            timeout-minutes: 40
            env:
                REBUILD_PAS_FILE: RebuildStandartModules.pas
    
    build-WinXP:
        name: Prepare and build on Legacy Windows Server 2019 VM to simulate WinXP
        runs-on: windows-2019
        steps:
          - uses: actions/checkout@v2
          
          - name: Setup .NET Framework 4.0
            uses: actions/setup-dotnet@v1
            with:
                dotnet-version: '4.0'
          
          - name: Install dependencies into Virtual Environment...
            run: _RegisterHelixNUnit.bat
          
          - name: Build project in Release-mode, compile Pas-units, run tests
            run: _RebuildReleaseAndRunTestsForGitHubActions.bat
            timeout-minutes: 40
            env:
                REBUILD_PAS_FILE: RebuildStandartWinXPModules.pas
    